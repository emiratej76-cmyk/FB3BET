<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB3 Admin</title>
<style>
body{font-family:Arial;margin:0;padding:10px;background:#f5f5f5}
.box{background:white;padding:15px;border-radius:10px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px}
button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;margin:4px 0}
.add{background:black;color:white}
.export{background:#ffcc00}
.listItem{display:flex;gap:10px;background:#fafafa;padding:8px;border-radius:8px;margin:6px 0;align-items:center}
.listItem img{width:50px;height:50px;object-fit:cover;border-radius:6px}
</style>
</head>
<body>
<h2>FB3 Admin Panel 📦</h2>
<div class="box">
<h3>Add New Product</h3>
<input id="pName" placeholder="Product Name">
<select id="pCat"><option>Electronics</option><option>Men</option><option>Women</option><option>Perfume</option><option>Watches</option><option>Ships from AE</option></select>
<input id="pPrice" type="number" placeholder="Selling Price GHS e.g. 650">
<input id="pOld" type="number" placeholder="Old Price GHS e.g. 900">
<input id="pImg" placeholder="Image Link from postimages.org">
<input id="pRating" placeholder="Rating" value="4.9 (100 sold)">
<button class="add" onclick="addProduct()">+ Add Product</button>
<small>Image: postimages.org > Upload > Direct Link > Paste here</small>
</div>
<div class="box">
<h3>Your Products (<span id="count">0</span>)</h3>
<div id="list"></div>
</div>
<div class="box">
<button class="export" onclick="exportCode()">📋 Copy PRODUCTS Code for GitHub</button>
<textarea id="exportArea" style="width:100%;height:200px;display:none;margin-top:10px"></textarea>
</div>
<script>
let PRODUCTS=JSON.parse(localStorage.getItem("fb3_admin_products")||"[]");
if(PRODUCTS.length==0){PRODUCTS=[
{id:1,name:"HP EliteBook 840 G7 Laptop i5 16GB Dubai",cat:"Electronics",price:3200,old:4500,img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500",rating:"4.9 (10k+ sold)"},
{id:2,name:"MacBook Air M2 256GB Dubai Original",cat:"Electronics",price:5500,old:7200,img:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500",rating:"5.0 (3k+ sold)"},
];}
function save(){localStorage.setItem("fb3_admin_products",JSON.stringify(PRODUCTS));render();}
function render(){
 document.getElementById("count").innerText=PRODUCTS.length;
 let div=document.getElementById("list");div.innerHTML="";
 PRODUCTS.forEach(p=>{
   div.innerHTML+=`<div class="listItem"><img src="${p.img}"><div style="flex:1"><b>${p.name}</b><br><small>${p.cat} - GHS ${p.price}</small></div><button onclick="del(${p.id})" style="width:auto;padding:6px 10px;background:red;color:white">X</button></div>`;
 });
}
function addProduct(){
 let name=document.getElementById("pName").value;
 let cat=document.getElementById("pCat").value;
 let price=parseFloat(document.getElementById("pPrice").value);
 let oldP=parseFloat(document.getElementById("pOld").value)||price+200;
 let img=document.getElementById("pImg").value||"https://via.placeholder.com/300";
 let rating=document.getElementById("pRating").value||"4.9 (100 sold)";
 if(!name||!price){alert("Enter name and price");return;}
 let id=Date.now();
 PRODUCTS.push({id,name,cat,price,old:oldP,img,rating});
 save();
 document.getElementById("pName").value="";document.getElementById("pPrice").value="";document.getElementById("pImg").value="";
 alert("Added! Total: "+PRODUCTS.length);
}
function del(id){PRODUCTS=PRODUCTS.filter(x=>x.id!=id);save();}
function exportCode(){
 let code="const PRODUCTS=[\n"+PRODUCTS.map(p=>`{id:${p.id},name:"${p.name.replace(/"/g,'')}",cat:"${p.cat}",price:${p.price},old:${p.old},img:"${p.img}",rating:"${p.rating}"},`).join("\n")+"\n];";
 document.getElementById("exportArea").style.display="block";
 document.getElementById("exportArea").value=code;
 document.getElementById("exportArea").select();
 document.execCommand("copy");
 alert("✅ Copied! Now paste into GitHub index.html");
}
render();
</script>
</body>
</html>
